name: pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "sonar-project.properties"
      - ".github/workflows/pipeline.yaml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "sonar-project.properties"
      - ".github/workflows/pipeline.yaml"

permissions: {} 

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 
          persist-credentials: false

      - name: Scan the history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Backend unit tests
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npm test
          sed -i 's|^SF:|SF:backend/|' coverage/lcov.info

      - name: Frontend lint
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run lint

      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compute the image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          load: true
          tags: fixboard-backend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend
          load: true
          tags: fixboard-frontend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Scan backend
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: fixboard-backend:${{ steps.tag.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: fixboard-frontend:${{ steps.tag.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Save the scanned images
        if: github.event_name == 'push'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker save "fixboard-backend:$TAG" "fixboard-frontend:$TAG" -o images.tar

      - name: Keep the images for the release job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: images
          path: images.tar
          retention-days: 1

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write 
      id-token: write 
    steps:
      # persist-credentials stays on here: the last step needs it to git push
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: images

      - name: Load the scanned images
        run: docker load -i images.tar

      - name: Sign in to AWS without a stored key
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Tag and push to ECR
        env:
          TAG: ${{ needs.build.outputs.tag }}
          ECR_BACKEND: ${{ vars.ECR_BACKEND }}
          ECR_FRONTEND: ${{ vars.ECR_FRONTEND }}
        run: |
          docker tag "fixboard-backend:$TAG" "$ECR_BACKEND:$TAG"
          docker tag "fixboard-frontend:$TAG" "$ECR_FRONTEND:$TAG"
          docker push "$ECR_BACKEND:$TAG"
          docker push "$ECR_FRONTEND:$TAG"

      - name: Record the new tags in Git
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          sed -i -E "s|(image: .*/backend:).*|\1$TAG|" k8s/05-backend.yaml
          sed -i -E "s|(image: .*/frontend:).*|\1$TAG|" k8s/06-frontend.yaml
          git add k8s/05-backend.yaml k8s/06-frontend.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Release $TAG [skip ci]"
            git push origin main
          else
            echo "Image tags already up to date"
          fi